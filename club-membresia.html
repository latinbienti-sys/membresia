<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Latinbien - Beneficios, Alianzas y Comercios Afiliados</title>
<meta name="description" content="Club Latinbien: beneficios exclusivos, comercios afiliados, líneas de crédito y alianzas. Descuentos en restaurantes, estacionamientos, gimnasios y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="https://latinbien.com/web/image/website/1/logo/LATINBIEN?unique=4695b15" type="image/png">
<style>
/* ===== RESET ===== */
:root{--primary:#213C83;--primary-dark:#1a2f66;--primary-light:#3D6194;--primary-ultra:#e8edf5;--accent:#F98B10;--accent-light:#fff3e0;--accent-dark:#e07d00;--gold:#D4A017;--silver:#8E9EAB;--bronze:#CD7F32;--platinum:#3D6194;--success:#10b981;--danger:#ef4444;--dark:#1a1a2e;--g-100:#f8f9fa;--g-200:#e9ecef;--g-300:#dee2e6;--g-400:#ced4da;--g-500:#adb5bd;--g-600:#6c757d;--g-700:#495057;--white:#fff;--shadow:0 4px 24px rgba(0,0,0,0.08);--shadow-lg:0 12px 48px rgba(0,0,0,0.12);--shadow-xl:0 20px 60px rgba(0,0,0,0.15);--r:12px;--r-lg:20px;--r-xl:28px;--t:all 0.3s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--dark);background:var(--white);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:80px 0;overflow:hidden}
.sec-head{text-align:center;margin-bottom:48px}
.sec-head .sub{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:12px}
.sec-head h2{font-size:clamp(26px,3.5vw,38px);font-weight:800;color:var(--primary);margin-bottom:12px;line-height:1.2}
.sec-head h2 .accent-c{color:var(--accent)}
.sec-head p{font-size:15px;color:var(--g-600);max-width:640px;margin:0 auto;line-height:1.7}
.bg-gray{background:var(--g-100)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.3s ease-in-out;cursor:pointer;border:none;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:0 8px 32px rgba(249,139,16,0.3)}
.btn-outline-l{background:transparent;color:#fff;border:2px solid rgba(255,255,255,0.3)}
.btn-outline-l:hover{border-color:#fff;background:rgba(255,255,255,0.1);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff;transform:translateY(-2px)}
.btn-secondary{background:var(--primary);color:#fff}
.btn-secondary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 32px rgba(33,60,131,0.3)}
.btn-sm{padding:10px 18px;font-size:13px;border-radius:8px}
.btn-block{width:100%;justify-content:center}
.btn-white{background:#fff;color:var(--accent)}
.btn-white:hover{background:var(--g-100);transform:translateY(-2px)}
.fade-in{opacity:0;transform:translateY(20px);transition:opacity 0.5s ease,transform 0.5s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}
.wsp{position:fixed;bottom:24px;right:24px;z-index:999;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,0.4);transition:all 0.3s ease;font-size:26px}
.wsp:hover{transform:scale(1.1);box-shadow:0 8px 24px rgba(37,211,102,0.5)}

/* Navbar */
.navbar{position:sticky;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--g-200);transition:var(--t)}
.navbar.scrolled{box-shadow:var(--shadow)}
.navbar .container{display:flex;align-items:center;justify-content:space-between;height:68px}
.navbar .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.navbar .logo img{height:38px;width:auto}
.navbar .logo span{font-size:20px;font-weight:800;color:var(--primary);letter-spacing:-0.5px}
.navbar .logo span .accent-c{color:var(--accent)}
.nav-links{display:flex;align-items:center;gap:20px;list-style:none}
.nav-links a{text-decoration:none;color:var(--g-700);font-size:13px;font-weight:500;transition:var(--t);position:relative;white-space:nowrap}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--accent);transition:var(--t)}
.nav-links a:hover{color:var(--primary)}.nav-links a:hover::after{width:100%}
.nav-links .nav-cta{background:var(--accent);color:#fff!important;padding:9px 20px;border-radius:8px;font-weight:600}
.nav-links .nav-cta:hover{background:var(--accent-dark);transform:translateY(-1px)}.nav-links .nav-cta::after{display:none}
.nav-links .nav-login{color:var(--primary)!important;font-weight:600;border:2px solid var(--primary);padding:7px 16px;border-radius:8px}
.nav-links .nav-login:hover{background:var(--primary);color:#fff!important}.nav-links .nav-login::after{display:none}
.menu-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:4px}
.menu-toggle span{display:block;width:24px;height:2px;background:var(--dark);border-radius:2px;transition:var(--t)}
.menu-toggle.active span:nth-child(1){transform:rotate(45deg)translate(5px,5px)}
.menu-toggle.active span:nth-child(2){opacity:0}
.menu-toggle.active span:nth-child(3){transform:rotate(-45deg)translate(5px,-5px)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 50%,#0f2250 100%);padding:80px 0 60px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30%;right:-10%;width:50%;height:200%;background:radial-gradient(ellipse,rgba(249,139,16,0.1) 0%,transparent 70%);pointer-events:none}
.hero .container{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.hero-c h1{font-size:clamp(32px,4.5vw,48px);font-weight:900;color:#fff;line-height:1.1;margin-bottom:16px}
.hero-c h1 .hero-accent{color:var(--accent)}
.hero-c p{font-size:17px;color:rgba(255,255,255,0.75);line-height:1.7;margin-bottom:28px;max-width:480px}
.hero-c .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(249,139,16,0.15);color:var(--accent);padding:6px 18px;border-radius:100px;font-size:12px;font-weight:600;margin-bottom:20px;border:1px solid rgba(249,139,16,0.2)}
.hero-img{display:flex;justify-content:center;align-items:center}
.hero-img img{max-width:100%;height:auto;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.3));animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hero-stats{display:flex;gap:32px;margin-top:32px;flex-wrap:wrap}
.hero-stats .s h3{font-size:24px;font-weight:700;color:var(--accent)}
.hero-stats .s p{font-size:12px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px;margin:0}

/* Marquee */
.marquee-wrap{background:var(--g-100);border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);overflow:hidden;padding:12px 0}
.marquee{display:flex;gap:20px;animation:marquee 30s linear infinite;width:max-content}
.marquee:hover{animation-play-state:paused}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.pill{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--g-200);border-radius:100px;padding:10px 22px;box-shadow:var(--shadow);white-space:nowrap;transition:var(--t)}
.pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.pill .pi{width:32px;height:32px;border-radius:50%;background:var(--primary-ultra);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pill .pt{font-size:13px;font-weight:600;color:var(--dark)}
.pill .pt span{color:var(--accent);font-weight:700}

/* Commerce cards */
.aff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.af-card{background:#fff;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--g-200);transition:var(--t)}
.af-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.af-banner{height:100px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.af-banner .afi{font-size:40px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.15))}
.af-discount{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700}
.af-cat{position:absolute;bottom:10px;left:16px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.8);background:rgba(0,0,0,0.2);padding:2px 10px;border-radius:100px}
.af-body{padding:20px}.af-body h4{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:4px}
.af-body .aft{font-size:12px;color:var(--g-500);margin-bottom:10px}
.af-body .afb{display:flex;flex-direction:column;gap:5px}
.af-body .afb span{font-size:12px;color:var(--g-600);display:flex;align-items:center;gap:6px}
.af-body .afb span::before{content:'✓';color:var(--success);font-weight:700}
.af-body .afc{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;transition:var(--t)}
.af-body .afc:hover{color:var(--accent-dark);gap:8px}
.af-rest .af-banner{background:linear-gradient(135deg,#c0392b,#e74c3c)}.af-parking .af-banner{background:linear-gradient(135deg,#2c3e50,#4a6fa5)}.af-gym .af-banner{background:linear-gradient(135deg,#1a5276,#5dade2)}.af-tech .af-banner{background:linear-gradient(135deg,#1a1a2e,#4a4a6a)}.af-store .af-banner{background:linear-gradient(135deg,#6c3483,#af7ac5)}.af-health .af-banner{background:linear-gradient(135deg,#1e8449,#52d689)}.af-education .af-banner{background:linear-gradient(135deg,#996515,#D4A017)}.af-hotel .af-banner{background:linear-gradient(135deg,#8B4513,#CD7F32)}.af-auto .af-banner{background:linear-gradient(135deg,#0f2250,#3D6194)}

/* Benefits grid */
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.bc{background:#fff;border-radius:var(--r-lg);padding:32px 24px;border:1px solid var(--g-200);transition:var(--t);text-align:center;position:relative;overflow:hidden;cursor:default}
.bc::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:var(--t)}
.bc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}.bc:hover::before{opacity:1}
.bc .icn{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px;background:var(--primary-ultra);color:var(--primary);transition:var(--t)}
.bc:hover .icn{background:var(--accent-light);color:var(--accent);transform:scale(1.1)rotate(-5deg)}
.bc h3{font-size:17px;font-weight:700;color:var(--primary);margin-bottom:8px}
.bc p{font-size:13px;color:var(--g-600);line-height:1.6}
.bc .tag{display:inline-block;margin-top:14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);background:var(--accent-light);padding:4px 14px;border-radius:100px}

/* Credit cards */
.cc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px;margin-top:20px}
.cc{background:#fff;border-radius:18px;overflow:hidden;transition:var(--t);position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.08);perspective:1000px}
.cc:hover{transform:translateY(-6px) rotateY(1deg);box-shadow:var(--shadow-xl)}
.cc.featured{transform:scale(1.04);box-shadow:0 12px 48px rgba(249,139,16,0.18)}
.cc.featured:hover{transform:scale(1.04) translateY(-6px) rotateY(1deg)}
.cc-bg{height:170px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 22px;overflow:hidden}
.cc-bg .cp{position:absolute;inset:0;opacity:0.1;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,0.05)20px,rgba(255,255,255,0.05)40px)}
.cc-bg .chip{width:36px;height:28px;background:linear-gradient(135deg,rgba(255,255,255,0.4),rgba(255,255,255,0.15));border-radius:4px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.2)}
.cc-bg .cl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,0.7);margin-bottom:2px}
.cc-bg .ct{font-size:20px;font-weight:800;color:#fff}
.cc-bg .ci{font-size:12px;color:rgba(255,255,255,0.85);margin-top:2px}
.cc-bg .ctb{position:absolute;top:16px;right:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.2);padding:3px 10px;border-radius:4px}
.cc-body{padding:22px}.cc-body .cf{list-style:none;margin-bottom:16px}
.cc-body .cf li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--g-700);border-bottom:1px solid var(--g-100)}
.cc-body .cf li:last-child{border-bottom:none}.cc-body .cf li .ck{color:var(--success);font-weight:700;flex-shrink:0}.cc-body .cf li .cr{color:var(--danger);font-weight:700;flex-shrink:0}
.cc-footer{padding:0 22px 22px}.cc-footer .btn{width:100%;justify-content:center}
.cc.featured .popular{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:4px 16px;border-radius:100px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;z-index:10;white-space:nowrap}
.c-bronze .cc-bg{background:linear-gradient(135deg,#8B4513,#CD7F32,#A0522D)}
.c-silver .cc-bg{background:linear-gradient(135deg,#4a5568,#8E9EAB,#6c757d)}
.c-gold .cc-bg{background:linear-gradient(135deg,#996515,#D4A017,#B8860B)}
.c-platinum .cc-bg{background:linear-gradient(135deg,#1a2f66,#213C83,#3D6194)}

/* Tabs */
.tabs-wrap{background:#fff;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow)}
.tabs-header{display:flex;gap:4px;background:var(--g-100);padding:6px;overflow-x:auto}
.tab-btn{padding:10px 24px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:600;color:var(--g-600);cursor:pointer;transition:var(--t);white-space:nowrap;font-family:inherit}
.tab-btn:hover{color:var(--primary);background:rgba(33,60,131,0.05)}
.tab-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.tab-content{display:none;padding:36px}
.tab-content.active{display:block;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-features{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tab-feature{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--g-100);border-radius:var(--r)}
.tab-feature .tfi{width:36px;height:36px;border-radius:10px;background:var(--primary-ultra);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.tab-feature div h4{font-size:14px;font-weight:600;color:var(--primary);margin-bottom:2px}
.tab-feature div p{font-size:12px;color:var(--g-500)}

/* Status */
.status-box{background:#fff;border-radius:var(--r-xl);padding:48px;box-shadow:var(--shadow);margin-top:40px}
.status-box .sh{text-align:center;margin-bottom:32px}
.status-box .sh h3{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:6px}
.status-box .sh p{font-size:14px;color:var(--g-600)}
.ladder{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 10px;position:relative}
.ladder::before{content:'';position:absolute;bottom:32px;left:8%;right:8%;height:4px;background:var(--g-200);border-radius:2px;z-index:0}
.ls{flex:1;text-align:center;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.ls .dot{width:18px;height:18px;border-radius:50%;background:var(--g-300);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:10px;transition:var(--t)}
.ls.active .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(249,139,16,0.2);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 4px rgba(249,139,16,0.2)}50%{box-shadow:0 0 0 8px rgba(249,139,16,0.1)}}
.ls.done .dot{background:var(--success)}
.ls .lbl{font-size:11px;font-weight:600;color:var(--g-500);text-transform:uppercase;letter-spacing:0.5px}
.ls.active .lbl{color:var(--accent);font-weight:700}.ls.done .lbl{color:var(--success)}
.ls .ld{font-size:10px;color:var(--g-400);margin-top:2px}.ls .li{font-size:20px;margin-bottom:6px}

/* Alliances */
.alliance-logos{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-bottom:48px}
.al-logo{background:#fff;border:1px solid var(--g-200);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;justify-content:center;min-height:70px;transition:var(--t);cursor:default;flex:0 1 auto;min-width:120px}
.al-logo:hover{box-shadow:var(--shadow);border-color:var(--accent);transform:translateY(-2px)}
.al-logo span{font-size:12px;font-weight:600;color:var(--g-700);text-align:center;line-height:1.3}
.al-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.al-card{background:var(--g-100);border-radius:var(--r-lg);padding:28px 24px;text-align:center;transition:var(--t);border:1px solid transparent}
.al-card:hover{background:#fff;border-color:var(--g-200);box-shadow:var(--shadow);transform:translateY(-3px)}
.al-card .ai{font-size:30px;margin-bottom:10px}
.al-card h4{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:6px}
.al-card p{font-size:13px;color:var(--g-600);line-height:1.6}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px;margin-top:20px}
.st{text-align:center;position:relative;padding:24px 16px}
.st:not(:last-child)::after{content:'→';position:absolute;top:50%;right:-20px;transform:translateY(-50%);font-size:24px;color:var(--accent);font-weight:300}
.st .num{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;margin:0 auto 12px;box-shadow:0 4px 16px rgba(249,139,16,0.25)}
.st h4{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:6px}
.st p{font-size:13px;color:var(--g-600);line-height:1.6}

/* Testimonials */
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.tc{background:#fff;border-radius:var(--r-lg);padding:28px;border:1px solid var(--g-200);transition:var(--t)}
.tc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tc .stars{color:var(--accent);font-size:14px;margin-bottom:10px}
.tc blockquote{font-size:14px;color:var(--g-700);line-height:1.7;margin-bottom:16px;font-style:italic}
.tc .author{display:flex;align-items:center;gap:10px}
.tc .author .av{width:40px;height:40px;border-radius:50%;background:var(--primary-ultra);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.tc .author .info h4{font-size:13px;font-weight:600;color:var(--dark)}
.tc .author .info span{font-size:11px;color:var(--g-500)}
.tc .bt{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 10px;border-radius:100px;margin-bottom:10px}
.bt-basico{background:#f5e6d3;color:#8B4513}.bt-medio{background:#e9ecef;color:#4a5568}.bt-vip{background:#e8edf5;color:#213C83}

/* CTA */
.cta{background:linear-gradient(135deg,var(--accent),var(--accent-dark));padding:56px 0;text-align:center;position:relative;overflow:hidden}
.cta::before{content:'';position:absolute;top:-50%;left:-20%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(255,255,255,0.1),transparent 70%);pointer-events:none}
.cta h2{font-size:clamp(26px,3.5vw,38px);font-weight:800;color:#fff;margin-bottom:12px}
.cta p{font-size:16px;color:rgba(255,255,255,0.85);max-width:560px;margin:0 auto 24px}

/* FAQ */
.faq{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.faq-i{border:1px solid var(--g-200);border-radius:var(--r);overflow:hidden;transition:var(--t)}
.faq-i:hover{border-color:var(--g-300)}
.faq-q{width:100%;padding:16px 20px;background:#fff;display:flex;justify-content:space-between;align-items:center;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--dark);font-family:inherit;transition:var(--t);text-align:left}
.faq-q:hover{background:var(--g-100)}
.faq-q .fi{font-size:18px;color:var(--accent);transition:var(--t);flex-shrink:0}
.faq-i.open .faq-q .fi{transform:rotate(45deg)}
.faq-a{padding:0 20px;max-height:0;overflow:hidden;transition:all 0.3s ease}
.faq-i.open .faq-a{padding:0 20px 16px;max-height:300px}
.faq-a p{font-size:13px;color:var(--g-600);line-height:1.7}

/* Auth sections (login prompt + user greeting) */
.auth-section{max-width:1200px;margin:0 auto;padding:0 24px;display:none}
.auth-section.visible{display:block}
.login-prompt{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;text-align:center;padding:48px 24px;border-radius:20px;margin:32px 0}
.login-prompt h2{font-size:clamp(22px,3vw,32px);font-weight:800;margin-bottom:12px}
.login-prompt p{font-size:15px;opacity:.9;margin-bottom:20px;max-width:480px;margin-left:auto;margin-right:auto}
.btn-login{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:#fff;color:var(--accent-dark);border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;transition:all .3s ease}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.15)}
.user-greeting{background:var(--primary-ultra);border-radius:20px;padding:24px 32px;margin-bottom:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.user-greeting .gt h3{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:4px}
.user-greeting .gt p{font-size:13px;color:var(--g-600)}
.user-greeting .gs{display:flex;gap:24px}
.user-greeting .gs .s{text-align:center}
.user-greeting .gs .s .num{font-size:22px;font-weight:800;color:var(--accent)}
.user-greeting .gs .s .lbl{font-size:11px;color:var(--g-500);text-transform:uppercase;letter-spacing:.5px}
.user-greeting .gs .level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.user-greeting .gs .level-basic{background:var(--accent-light);color:var(--bronze)}
.user-greeting .gs .level-medio{background:#e9ecef;color:#4a5568}
.user-greeting .gs .level-vip{background:var(--primary-ultra);color:var(--primary)}

/* Tier Dashboard */
.tier-dashboard{background:#fff;border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:40px;border:1px solid var(--g-200)}
.tier-dashboard.loading{opacity:.6;pointer-events:none}
.tier-dashboard .td-loading{text-align:center;padding:48px;color:var(--g-500);font-size:14px}
.tier-dashboard .td-loading .spinner{width:40px;height:40px;border:3px solid var(--g-200);border-top-color:var(--accent);border-radius:50%;animation:td-spin .8s linear infinite;margin:0 auto 16px}
@keyframes td-spin{to{transform:rotate(360deg)}}
.td-head{padding:28px 32px;border-bottom:1px solid var(--g-200);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.td-head h3{font-size:20px;font-weight:800;color:var(--primary)}
.td-head .td-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:100px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.td-badge-empty{background:var(--g-100);color:var(--g-500)}
.td-badge-basica{background:var(--accent-light);color:var(--bronze)}
.td-badge-media{background:#e9ecef;color:#4a5568}
.td-badge-vip{background:var(--primary-ultra);color:var(--primary)}
.td-badge-suspendido{background:#fff0f0;color:var(--danger)}
.td-body{padding:32px}
.td-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:32px}
.td-metric{background:var(--g-100);border-radius:var(--r);padding:20px;text-align:center;transition:var(--t)}
.td-metric:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.td-metric .tm-icon{font-size:24px;margin-bottom:8px}
.td-metric .tm-value{font-size:24px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
.td-metric .tm-label{font-size:12px;color:var(--g-500);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.td-metric .tm-sub{font-size:11px;color:var(--g-400);margin-top:2px}
.td-metric.highlight .tm-value{color:var(--accent)}
.td-divider{height:1px;background:var(--g-200);margin:24px 0}
.td-tiers-compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.td-tier-box{border:2px solid var(--g-200);border-radius:var(--r-lg);padding:20px;text-align:center;transition:var(--t);position:relative;overflow:hidden}
.td-tier-box.active{border-color:var(--accent);box-shadow:0 0 0 4px rgba(249,139,16,.1)}
.td-tier-box.reached{opacity:1}
.td-tier-box.unreached{opacity:.5}
.td-tier-box .tb-icon{font-size:32px;margin-bottom:8px}
.td-tier-box .tb-name{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:4px}
.td-tier-box .tb-req{font-size:11px;color:var(--g-500);line-height:1.5}
.td-tier-box .tb-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.td-tier-box .tb-check.checked{background:var(--success);color:#fff}
.td-tier-box .tb-check.unchecked{background:var(--g-200);color:var(--g-400)}
.td-tier-box.active .tb-name{color:var(--accent)}
.td-status-bar{margin-top:24px;padding:16px;background:var(--g-100);border-radius:var(--r);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--g-600)}
.td-status-bar .sb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sb-green{background:var(--success)}.sb-red{background:var(--danger)}.sb-yellow{background:var(--accent)}

/* Newsletter */
.news{background:var(--g-100);padding:40px 0;text-align:center}
.news-box{max-width:520px;margin:0 auto}
.news-box h3{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:6px}
.news-box p{font-size:13px;color:var(--g-600);margin-bottom:20px}
.news-form{display:flex;gap:8px;max-width:440px;margin:0 auto}
.news-form input{flex:1;padding:10px 16px;border:1px solid var(--g-300);border-radius:8px;font-size:13px;font-family:inherit}
.news-form input:focus{outline:none;border-color:var(--accent)}
.news-form button{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--t);font-family:inherit}
.news-form button:hover{background:var(--primary-dark)}

/* Contact & Footer */
.contact-section{background:var(--primary);color:#fff;padding:60px 0}
.contact-section .sec-head h2{color:#fff}.contact-section .sec-head p{color:rgba(255,255,255,0.7)}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.contact-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);border-radius:var(--r);padding:24px;text-align:center;border:1px solid rgba(255,255,255,0.1);transition:var(--t)}
.contact-card:hover{background:rgba(255,255,255,0.12);transform:translateY(-2px)}
.contact-card .ic{font-size:24px;margin-bottom:10px}
.contact-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.contact-card p,.contact-card a{font-size:13px;color:rgba(255,255,255,0.8);text-decoration:none;line-height:1.6}
.contact-card a:hover{color:var(--accent)}

.footer{background:var(--dark);color:rgba(255,255,255,0.6);padding:48px 0 24px}
.footer .container{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.footer h4{color:#fff;font-size:14px;font-weight:600;margin-bottom:14px}
.footer p,.footer a{font-size:13px;color:rgba(255,255,255,0.5);text-decoration:none;line-height:2;display:block}
.footer a:hover{color:var(--accent)}.footer .fl{margin-bottom:12px}.footer .fl img{height:36px;width:auto}
.footer .social{display:flex;gap:10px;margin-top:12px}
.footer .social a{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:14px;transition:var(--t);color:rgba(255,255,255,0.5);text-decoration:none}
.footer .social a:hover{background:var(--accent);color:#fff!important}
.fb{border-top:1px solid rgba(255,255,255,0.06);margin-top:36px;padding-top:20px;text-align:center;font-size:12px}

/* Responsive */
@media(max-width:992px){
  .hero .container{grid-template-columns:1fr;text-align:center}

  .tab-features{grid-template-columns:1fr}.tab-content{padding:24px}

// ===== ODOO JSON-RPC CLIENT =====
// Funciones de consulta a Odoo (solo lectura, no modifica nada)
async function odooCall(model, method, args, kwargs) {
  const resp = await fetch('/web/dataset/call_kw/' + model + '/' + method, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0',
      method: 'call',
      params: { model: model, method: method, args: args || [], kwargs: kwargs || {} },
      id: 'club_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5)
    })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.data?.message || 'Error Odoo');
  return data.result;
}

// ===== CLASIFICACIÓN DE RANGOS =====
function calculateTier(contractCount, totalBilling, hasOverdue) {
  if (hasOverdue) {
    return {
      tier: null, name: 'Suspendido', icon: '🚫', color: 'suspendido',
      label: 'Membresía suspendida',
      message: 'Tienes pagos vencidos. Regulariza tu deuda para reactivar tu rango.',
      nextStep: 'Regularizar pagos →',
      nextHref: 'https://latinbien.com/my'
    };
  }
  if (contractCount > 8 && totalBilling > 6000) {
    return {
      tier: 'vip', name: 'VIP', icon: '💎', color: 'vip',
      label: 'Membresía VIP',
      message: 'Acceso a todos los beneficios, eventos exclusivos y crédito premium.',
      nextStep: 'Ir a mi cuenta',
      nextHref: 'https://latinbien.com/my'
    };
  }
  if (contractCount >= 8 && totalBilling >= 3000.01 && totalBilling <= 6000) {
    return {
      tier: 'media', name: 'Media', icon: '🥈', color: 'media',
      label: 'Membresía Media',
      message: 'Descuentos en comercios, envío prioritario y soporte dedicado.',
      nextStep: 'Ir a mi cuenta',
      nextHref: 'https://latinbien.com/my'
    };
  }
  if (contractCount >= 4 && totalBilling >= 3000) {
    return {
      tier: 'basica', name: 'Básica', icon: '🥉', color: 'basica',
      label: 'Membresía Básica',
      message: 'Acceso a línea de crédito básica con inicial desde 50%.',
      nextStep: 'Ir a mi cuenta',
      nextHref: 'https://latinbien.com/my'
    };
  }
  // No cumple requisitos
  return {
    tier: null, name: 'Sin rango', icon: '🔘', color: 'empty',
    label: 'Aún no calificas',
    message: 'Necesitas al menos 4 contratos activos y \$3,000 en facturación para obtener un rango.',
    nextStep: 'Ver comercios',
    nextHref: '#club-comercios'
  };
}

// ===== CONSULTAR DATOS DESDE ODOO (solo lectura) =====
async function fetchContractData(partnerId) {
  try {
    // 1. Contar contratos activos (account.move con status operativo 4 o 6)
    const contractIds = await odooCall('account.move', 'search', [[
      ['partner_id', '=', partnerId],
      ['x_status_operativos', 'in', ['4', '6']],
      ['move_type', '=', 'out_invoice']
    ]]);

    const contractCount = contractIds.length;

    // 2. Leer datos financieros de los contratos
    let totalBilling = 0;
    let totalPaid = 0;
    let totalPending = 0;
    let hasOverduePayments = false;
    let overdueCount = 0;

    if (contractCount > 0) {
      const contracts = await odooCall('account.move', 'read', [contractIds, ['amount_total', 'amount_residual']]);

      for (const c of contracts) {
        const total = parseFloat(c.amount_total) || 0;
        const residual = parseFloat(c.amount_residual) || 0;
        totalBilling += total;
        totalPending += residual;
        totalPaid += (total - residual);
      }

      // 3. Verificar cuotas vencidas (invoice.installment.line)
      try {
        const overdueLines = await odooCall('invoice.installment.line', 'search', [[
          ['invoice_id', 'in', contractIds],
          ['state', '=', 'vencido']
        ]]);
        overdueCount = overdueLines.length;
        hasOverduePayments = overdueCount > 0;
      } catch(e) {
        // Si el modelo no existe, intentar con account.move directamente
        // Revisar si algún contrato tiene amount_residual == amount_total (no se ha pagado nada)
        if (totalPending >= totalBilling * 0.5) {
          hasOverduePayments = true;
        }
      }
    }

    return {
      contractCount,
      totalBilling,
      totalPaid,
      totalPending,
      hasOverduePayments,
      overdueCount,
      contracts: contractIds
    };
  } catch(e) {
    console.warn('Club Latinbien: Error consultando datos', e);
    return null;
  }
}

// ===== ODOO SESSION DETECTION + TIER CLASSIFICATION =====
async function checkOdooSession() {
  try {
    const resp = await fetch('/web/session/get_session_info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'call',
        params: {},
        id: 'club_session_' + Date.now()
      })
    });
    const data = await resp.json();
    if (data.result && data.result.uid) {
      const s = data.result;
      const isPublic = !s.username || s.username === '' ||
                       s.username === 'public' ||
                       s.share === true ||
                       (s.partner_id && s.partner_id[1] === 'Public');

      if (!isPublic) {
        // Usuario autenticado
        CONFIG.session.loggedIn = true;
        CONFIG.session.name = s.name || s.username || 'Miembro';
        CONFIG.session.partnerId = s.partner_id ? s.partner_id[0] : null;

        // Mostrar saludo
        const authSec = document.getElementById('authSection');
        if (authSec) authSec.classList.add('visible');
        document.getElementById('loginPrompt').style.display = 'none';
        const userGreeting = document.getElementById('userGreeting');
        if (userGreeting) userGreeting.style.display = 'flex';
        document.getElementById('greetingName').textContent = '👋 ¡Hola, ' + CONFIG.session.name + '!';

        // Consultar datos desde Odoo
        if (CONFIG.session.partnerId) {
          const contractData = await fetchContractData(CONFIG.session.partnerId);
          if (contractData) {
            Object.assign(CONFIG.session, contractData);
            // Actualizar greeting con el nivel
            const tierInfo = calculateTier(contractData.contractCount, contractData.totalBilling, contractData.hasOverduePayments);
            const greetingMsg = document.getElementById('greetingMsg');
            if (greetingMsg) {
              greetingMsg.innerHTML = 'Rango actual: <strong>' + tierInfo.icon + ' ' + tierInfo.name + '</strong> &bull; ' +
                contractData.contractCount + ' contratos &bull; <a href="#mi-rango" style="color:var(--accent);font-weight:600;">Ver tablero completo →</a>';
            }
            // Renderizar tablero de rangos
            renderTierDashboard(contractData);
          } else {
            // Fallback: mostrar dashboard con datos vacíos
            renderTierDashboard({
              contractCount: 0, totalBilling: 0, totalPaid: 0,
              totalPending: 0, hasOverduePayments: false, overdueCount: 0
            });
          }
        }

        return;
      }
    }
  } catch(e) {
    console.log('Club Latinbien: No se pudo verificar sesión', e);
  }

  // No autenticado o error (vista local o público)
  const authSec = document.getElementById('authSection');
  if (authSec) authSec.classList.add('visible');
  document.getElementById('loginPrompt').style.display = 'block';
  const userGreeting = document.getElementById('userGreeting');
  if (userGreeting) userGreeting.style.display = 'none';

      // ── MODO DEMO LOCAL (Datos reales de Yarley Carmona) ──
  if (window.location.protocol === 'file:') {
    document.getElementById('loginPrompt').style.display = 'none';
    if (userGreeting) {
      userGreeting.style.display = 'flex';
      document.getElementById('greetingName').textContent = '\U0001f44b \u00a1Hola, YARLEY CAROLINA CARMONA HIDALGO!';
      document.getElementById('greetingMsg').innerHTML = 'Rango actual: <strong>[-] Sin rango</strong> &bull; 1 contratos &bull; <a href="#mi-rango" style="color:var(--accent);font-weight:600;">Ver tablero completo \u2192</a>';
    }
    if (authSec) authSec.classList.add('visible');
    renderTierDashboard({"contractCount": 1, "totalBilling": 1595.33, "totalPaid": 505.82, "totalPending": 1089.51, "hasOverduePayments": false, "overdueCount": 0});
  }
}

// IntersectionObserver for fade-in
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1 });
document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));

// Tabs
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick*="'${tab}'"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

// FAQ
function toggleFaq(btn) {
  const item = btn.closest('.faq-i');
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-i.open').forEach(el => el.classList.remove('open'));
  if (!isOpen) item.classList.add('open');
}

// Smooth scroll
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', function(e) {
    const id = this.getAttribute('href');
    if (id === '#') return;
    const target = document.querySelector(id);
    if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
});
